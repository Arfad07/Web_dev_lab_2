
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header and Footer using Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>My Website</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home">
        <section class="content">
            <h2>Welcome to My Website</h2>
            <p>This webpage demonstrates CSS Flexbox.</p>
        </section>

        <section class="content" id="about">
            <h2>About Us</h2>
            <p>We are learning modern web development.</p>
        </section>
    </main>

    <footer class="footer" id="contact">
        <p>&copy; 2026 My Website. All rights reserved.</p>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </div>
    </footer>

</body>
</html>
